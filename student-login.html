<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login – CareerConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-navy">
        <div class="container">
            <a class="navbar-brand" href="index.html">CareerConnect</a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm btn-rounded me-2">Home</a>
                <a href="recruiter-login.html" class="btn btn-light btn-sm btn-rounded">Recruiter Login</a>
            </div>
        </div>
    </nav>

    <!-- Login Card -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card">
                    <div class="auth-header">
                        <h3 class="fw-bold mb-1">Student Portal Login</h3>
                        <p class="small mb-0 opacity-75">Sign in to browse jobs and track applications</p>
                    </div>
                    <div class="card-body p-4 bg-white">
                        <div id="loginError" class="alert alert-danger d-none"></div>

                        <form id="studentLoginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="email" class="form-control" required
                                    placeholder="Enter registered email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <input type="password" id="password" class="form-control" required
                                        placeholder="Enter password">
                                    <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePassword('password', this)">Show</button>
                                </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-navy btn-lg">Login as Student</button>
                            </div>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="mb-1 text-muted small">New to CareerConnect?</p>
                            <a href="student-register.html" class="btn btn-outline-navy btn-sm w-100">Create Student
                                Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('studentLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('loginError');

            const students = getData('cc_students');
            const matchedStudent = students.find(s => s.email.toLowerCase() === email && s.password === password);

            if (!matchedStudent) {
                errorBox.textContent = "Invalid email or password! Please check your credentials or register first.";
                errorBox.classList.remove('d-none');
                return;
            }

            // Save logged-in student ID in sessionStorage
            sessionStorage.setItem('cc_current_student', matchedStudent.id);
            window.location.href = "student-dashboard.html";
        });
    </script>
</body>

</html>
